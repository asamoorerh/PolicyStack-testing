{{- /*
Inform-only readiness gate. This is what other elements depend on via `element:
openshift-data-foundation`, so it is the contract for "storage is usable".

It asserts the StorageClasses ODF publishes, NOT StorageCluster status conditions. Every condition on
a StorageCluster tracks live health: ocs-operator's SetProgressingCondition sets Available=False
alongside Progressing=True, MapCephClusterNegativeConditions maps live CephCluster state onto
Available/Degraded/Progressing, and ResetUnreportedConditionsToHealthy flips them back when a
component recovers. A gate built on them therefore flaps with Ceph health - and because an ACM
dependency that is not Compliant puts the dependent policy into Pending, every element depending on
this one gets paused and warned each time a mon or OSD restarts.

The StorageClasses are the monotonic fact dependents actually need: they appear once ODF has brought
the cluster up and they persist through transient degradation. Dependents here consume storage by
creating PVCs and ObjectBucketClaims, so "the classes exist" is exactly the precondition.

Live health is reported by the `health` policy in this same element. Nothing depends on that one, so
it can flap freely without pausing anything.
*/ -}}
- complianceType: musthave
  objectDefinition:
    apiVersion: storage.k8s.io/v1
    kind: StorageClass
    metadata:
      name: {{ .Parameters.name }}-ceph-rbd
- complianceType: musthave
  objectDefinition:
    apiVersion: storage.k8s.io/v1
    kind: StorageClass
    metadata:
      name: {{ .Parameters.name }}-cephfs
- complianceType: musthave
  objectDefinition:
    apiVersion: storage.k8s.io/v1
    kind: StorageClass
    metadata:
      name: {{ .Parameters.namespace }}.noobaa.io
