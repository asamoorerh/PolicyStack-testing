stack:
  openshiftVirtualization:
    enabled: true
  metallb:
    enabled: true
    toggles:
      addressing: true
    config:
      ipAddressPools:
        hcp-api:
          addresses:
            - 10.10.10.15-10.10.10-20
      l2Advertisements:
        hcp-api:
          ipAddressPools:
            - hcp-api
