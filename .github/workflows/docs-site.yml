name: Documentation Site

# No path filter: the build takes seconds and can be a required check.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pull request runs cancel each other. Runs on main queue, so a publish is never cut off; a newer
# pending run replaces an older one, which is what an unversioned site wants.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tools/requirements-docs.txt

      - run: pip install -r tools/requirements-docs.txt

      # Fails on a relative .md link or anchor that does not resolve, or a missing snippet.
      - run: zensical build --strict

      # Only main is published. Pull requests and manual runs on other branches just build.
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site/

  # A separate job so the write token never shares a runner with pip-installed build code.
  publish:
    name: Publish to gh-pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # push gh-pages
      pages: write     # request the Pages build
    steps:
      # The deploy action works through a git worktree, so it needs a checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site/

      # Zensical drops dotfiles. Without .nojekyll, Pages runs the site through Jekyll.
      - run: touch site/.nojekyll

      # single-commit: the branch holds one snapshot. Built HTML has no useful history, and Argo CD
      # repo-servers fetch every branch, gh-pages included.
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: site
          branch: gh-pages
          single-commit: true

      # GitHub documents that a push made with GITHUB_TOKEN does not start a Pages build.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
