version: 2
updates:
  # Keeps the SHA-pinned actions current; the version comment on each `uses:` line is updated too.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /tools/validator
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
