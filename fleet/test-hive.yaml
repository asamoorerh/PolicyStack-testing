revision: main
hub: aws-east-1
version: 4.20.8
channel: stable-4.20
valueFiles:
  - platforms/aws.yaml
install:
  baseDomain: sandbox1266.opentlc.com
  hive:
    platform:
      aws:
        region: us-east-2
    installConfig:
      controlPlane:
        replicas: 1
        platform:
          aws:
            type: m6i.2xlarge
            zones:
              - us-east-2a
